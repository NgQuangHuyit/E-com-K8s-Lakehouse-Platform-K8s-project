apiVersion: v1
kind: Service
metadata:
  name: hue
  namespace: lakehouse
spec:
  selector:
    app: hue
  ports:
    - port: 8888
      targetPort: 8888
  type: ClusterIP
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hue-ingress
  namespace: lakehouse
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: hue.lakehouse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hue
                port:
                  number: 8888
