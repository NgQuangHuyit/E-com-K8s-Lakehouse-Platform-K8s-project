apiVersion: v1
kind: Service
metadata:
  name: spark-thrift-service
  namespace: lakehouse
spec:
  clusterIP: None
  selector:
    app: spark-thrift-server
  ports:
    - name: thrift-server-port
      protocol: TCP
      port: 10000
      targetPort: 10000
    - protocol: TCP
      name: spark-driver-port
      port: 7078
      targetPort: 7078
    - protocol: TCP
      name: thrift-webui-port
      port: 4040
      targetPort: 4040
---
apiVersion: v1
kind: Service
metadata:
  name: spark-thrift-jdbc
  namespace: lakehouse
  labels:
    app: spark-thrift-server
spec:
  type: NodePort
  selector:
    app: spark-thrift-server
  ports:
    - name: thrift-jdbc
      protocol: TCP
      port: 10000          
      targetPort: 10000    
      nodePort: 31000  

---     
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-thrift-server
  namespace: lakehouse
spec:
  serviceName: spark-thrift-service
  replicas: 1
  selector:
    matchLabels:
      app: spark-thrift-server
  template:
    metadata:
      labels:
        app: spark-thrift-server
    spec:
      serviceAccountName: spark
      containers:
        - name: thrift-server
          image: ngquanghuyit/spark-delta-lake:3.3
          command:
            - 'sh'
            - '-c'
            - >-
              sleep 10 && ./sbin/start-thriftserver.sh
              --conf spark.dynamicAllocation.enabled=true
              --conf spark.kubernetes.container.image=ngquanghuyit/spark-delta-lake:3.3
              --conf spark.kubernetes.driver.pod.name=spark-thrift-server-0
              --conf spark.kubernetes.executor.request.cores="500m"
              --conf spark.kubernetes.executor.numExecutors=2
              --conf spark.kubernetes.namespace=lakehouse
              --conf spark.driver.host=spark-thrift-service
              --conf spark.driver.bindAddress=spark-thrift-server-0
              --conf spark.driver.port=7078
              --conf spark.dynamicAllocation.shuffleTracking.enabled=true
              && tail -f /opt/bitnami/spark/logs/spark--org.apache.spark.sql.hive.thriftserver.HiveThriftServer2-1-spark-thrift-server-0.out
          ports:
            - containerPort: 10000
            - containerPort: 4040
            - containerPort: 7078
          volumeMounts:
            - name: spark-config
              mountPath: /opt/bitnami/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
      volumes:
        - name: spark-config
          configMap:
            name: spark-history-config          
      
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spark-thrift-ui
  namespace: lakehouse
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: spark-ui.lakehouse.local   # đổi thành domain bạn muốn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spark-thrift-service
                port:
                  number: 4040
