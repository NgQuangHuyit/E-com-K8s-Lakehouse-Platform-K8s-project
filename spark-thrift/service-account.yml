apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-server
  namespace: lakehouse
rules:
- apiGroups: [""]
  resources: ["pods", "persistentvolumeclaims", "configmaps", "services"]
  verbs: ["get", "deletecollection", "create", "list", "watch", "delete"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: lakehouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-rolebinding
  namespace: lakehouse
subjects:
- kind: ServiceAccount
  name: spark
  namespace: lakehouse
roleRef:
  kind: Role
  name: spark-server
  namespace: lakehouse
  apiGroup: rbac.authorization.k8s.io
