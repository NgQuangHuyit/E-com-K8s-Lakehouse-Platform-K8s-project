apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:25.0.0
          ports:
            - containerPort: 8978
          volumeMounts:
            - name: cloudbeaver-workspace
              mountPath: /opt/cloudbeaver/workspace
      volumes:
        - name: cloudbeaver-workspace
          persistentVolumeClaim:
            claimName: cloudbeaver-pvc
        - name: trino-certs
          secret:
            secretName: trino-ssl-secret

---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: lakehouse
spec:
  selector:
    app: cloudbeaver
  ports:
    - protocol: TCP
      port: 8978
      targetPort: 8978
  type: ClusterIP

--- 
apiVersion: v1
kind: Ingress
metadata:
  name: cloudbeaver-ingress
  namespace: lakehouse
spec:
  ingressClassName: nginx
  rules:
    - host: cloudbeaver.lakehouse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudbeaver
                port:
                  number: 8978 

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver-pvc
  namespace: lakehouse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1.5Gi
  storageClassName: "do-block-storage"
