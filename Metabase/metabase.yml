apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: lakehouse
spec:
  selector:
    matchLabels:
      app: metabase
  replicas: 1
  template:
    metadata:
      labels:
        app: metabase
    spec:
      containers:
        - name: metabase
          image: metabase/metabase:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: MB_DB_TYPE
              value: "mysql"
            
            - name: MB_DB_HOST
              value: "mysql-2.lakehouse.svc.cluster.local" 
            
            - name: MB_DB_PORT
              value: "3306"
            
            - name: MB_DB_DBNAME
              value: "metabase" 
            
            - name: MB_DB_USER
              value: "root"
            
            - name: MB_DB_PASS
              value: "root" 
            
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metabase-svc
  namespace: lakehouse
spec:
  type: ClusterIP
  selector:
    app: metabase
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metabase-ingress
  namespace: lakehouse
spec:
  ingressClassName: nginx
  rules:
    - host: metabase.lakehouse.local 
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metabase-svc
                port:
                  number: 80