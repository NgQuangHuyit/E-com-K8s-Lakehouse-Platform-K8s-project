apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: purchase-prediction-inference-{{ ds_nodash }}
  namespace: default
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "your-registry/spark-ml-inference:latest"  # Update with your Docker registry
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/spark/jobs/ml_inference.py
  arguments:
    - "--execution-date"
    - "{{ ds }}"
    - "--model-s3-path"
    - "s3a://lakehouse/models/purchase_prediction/model.pkl"
    - "--s3-endpoint"
    - "http://minio.default.svc.cluster.local:9000"
    - "--s3-access-key"
    - "minioadmin"
    - "--s3-secret-key"
    - "minioadmin"
  
  sparkVersion: "3.4.1"
  
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20
  
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "2g"
    labels:
      version: 3.4.1
      app: purchase-prediction-inference
    serviceAccount: spark
    env:
      - name: AWS_ACCESS_KEY_ID
        value: "minioadmin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "minioadmin"
  
  executor:
    cores: 1
    instances: 2
    memory: "2g"
    labels:
      version: 3.4.1
      app: purchase-prediction-inference
    env:
      - name: AWS_ACCESS_KEY_ID
        value: "minioadmin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "minioadmin"
  
  deps:
    jars:
      - "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.4_2.12/1.4.2/iceberg-spark-runtime-3.4_2.12-1.4.2.jar"
      - "https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar"
      - "https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.367/aws-java-sdk-bundle-1.12.367.jar"
