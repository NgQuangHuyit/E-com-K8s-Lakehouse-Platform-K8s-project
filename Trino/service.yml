apiVersion: v1
kind: Service
metadata:
  name: trino-coordinator
  namespace: lakehouse
spec:
  selector:
    app: trino-coordinator
  ports:
    - protocol: TCP
      port: 8080
      nodePort: 30080
  type: NodePort

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino-coordinator
  namespace: lakehouse
spec:
  rules:
    - host: trino.lakehouse.local   
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hue
                port:
                  number: 8888
