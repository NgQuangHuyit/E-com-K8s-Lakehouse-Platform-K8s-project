apiVersion: v1
kind: ConfigMap
metadata:
  name: delta-properties
  namespace: lakehouse
data:
  delta.properties: |
    # Add the contents of your delta.properties file here
    connector.name=delta-lake
    hive.metastore.uri=thrift://hive-metastore.lakehouse.svc.cluster.local:9083
    hive.s3.aws-access-key=minio
    hive.s3.aws-secret-key=minioadmin123
    hive.s3.endpoint=http://minio-1760084160.lakehouse.svc.cluster.local:9000
    hive.s3.path-style-access=true
    hive.s3.ssl.enabled=false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-properties
  namespace: lakehouse
data:
  Hive.properties: |
    # Add the contents of your Hive.properties file here
    connector.name=hive
    hive.metastore.uri=thrift://hive-metastore.lakehouse.svc.cluster.local:9083
    hive.s3.aws-access-key=minio
    hive.s3.aws-secret-key=minioadmin123
    hive.s3.endpoint=http://minio-1760084160.lakehouse.svc.cluster.local:9000
    hive.s3.path-style-access=true
    hive.s3.ssl.enabled=false