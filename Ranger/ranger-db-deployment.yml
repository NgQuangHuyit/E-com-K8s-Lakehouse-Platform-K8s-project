apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-db
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ranger-db
  template:
    metadata:
      labels:
        app: ranger-db
    spec:
      containers:
        - name: ranger-db
          image: apache/ranger-db:2.5.0
          ports:
            - containerPort: 5432
          env:
            - name: RANGER_DB_TYPE
              value: "postgres"
          volumeMounts:
            - name: ranger-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init_postgres.sh
              subPath: init_postgres.sh
      volumes:
        - name: ranger-data
          persistentVolumeClaim:
            claimName: ranger-pvc
        - name: init-script
          configMap:
            name: ranger-db-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: ranger-db
  namespace: lakehouse
spec:
  selector:
    app: ranger-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
